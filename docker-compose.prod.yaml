services:
  chatbot-integracar:
    image: chatbot-integracar:latest
    build:
      context: .
      dockerfile: prod.Dockerfile
    volumes:
      - app_shared:/code/media
      - static_volume:/code/static
    env_file:
      - ./.env
    command: /start
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import http.client
          connection = http.client.HTTPConnection("127.0.0.1", 8000, timeout=3)
          connection.request("GET", "/contas/entrar/", headers={
              "Host": "chatbotintegracar.online",
              "X-Forwarded-Proto": "https",
          })
          raise SystemExit(0 if connection.getresponse().status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - proxy

  qcluster:
    image: chatbot-integracar:latest
    volumes:
      - app_shared:/code/media
    env_file:
      - ./.env
    command: python manage.py qcluster
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  redeneuralbert:
    image: integracar/redeneuralbert:8.0
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: paradedb/paradedb:latest-pg17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: chatbot-integracar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network
    healthcheck:
      test: pg_isready -d chatbot-integracar -U postgres
      interval: 5s
      retries: 10
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

  proxy:
    external: true

volumes:
  app_shared:
  postgres_data:
  static_volume:
